<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini CRM Commercial — Bêta (HTML autonome)</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --good: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
      --radius: 14px;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px 1fr;
    }

    aside {
      background: #0f172a;
      color: #fff;
      padding: 20px;
      border-right: 1px solid #1e293b;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .subtitle { color: #93c5fd; font-size: .9rem; margin-bottom: 18px; }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu button {
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-weight: 600;
    }

    .menu button.active,
    .menu button:hover {
      background: #1e293b;
      color: #fff;
    }

    main { padding: 20px; }

    .header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title { margin: 0; font-size: 1.5rem; }
    .muted { color: var(--muted); margin-top: 4px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button.primary, button.ghost {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-dark); }

    button.ghost {
      background: #fff;
      color: #334155;
      border: 1px solid var(--line);
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .kpi-label { color: var(--muted); font-size: .85rem; }
    .kpi-value { font-size: 1.5rem; font-weight: 800; margin-top: 5px; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 12px;
    }

    .panel h3 { margin: 0 0 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .93rem;
    }

    th, td {
      border-bottom: 1px solid #eef2f7;
      text-align: left;
      padding: 9px 6px;
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 700; }

    .badge {
      display: inline-block;
      font-size: .75rem;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .ok { background: #dcfce7; color: #166534; }
    .mid { background: #fef3c7; color: #92400e; }
    .bad { background: #fee2e2; color: #991b1b; }
    .blue { background: #dbeafe; color: #1e40af; }

    form {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 8px;
    }

    input, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 9px;
      font: inherit;
      background: #fff;
    }

    .full { grid-column: 1 / -1; }

    .hidden { display: none; }

    @media (max-width: 1020px) {
      .app { grid-template-columns: 1fr; }
      aside { position: sticky; top: 0; z-index: 2; }
      .menu { flex-direction: row; overflow: auto; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      main { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
      form { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="logo">Mini CRM</div>
      <div class="subtitle">Version bêta — autonome</div>
      <div class="menu" id="menu"></div>
    </aside>

    <main>
      <div class="header">
        <div>
          <h1 class="title" id="pageTitle">Dashboard</h1>
          <div class="muted" id="pageSubtitle">Vue d'ensemble de l'activité commerciale.</div>
        </div>
        <div class="actions">
          <button class="ghost" id="resetBtn">Réinitialiser les données</button>
          <button class="primary" id="saveBtn">Sauvegarder localement</button>
        </div>
      </div>

      <section id="dashboardView"></section>
      <section id="clientsView" class="hidden"></section>
      <section id="visitesView" class="hidden"></section>
      <section id="relancesView" class="hidden"></section>
      <section id="devisView" class="hidden"></section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "mini-crm-beta-v1";

    const sample = {
      clients: [
        { id: "C001", nom: "Camille Durand", societe: "Nexa Studio", segment: "Startup", statut: "Client actif", valeur: 12000 },
        { id: "C002", nom: "Hugo Martin", societe: "BatiVision", segment: "PME", statut: "Prospect", valeur: 6800 },
        { id: "C003", nom: "Léa Moreau", societe: "AeroPulse", segment: "Grand compte", statut: "À relancer", valeur: 28500 }
      ],
      visites: [
        { id: "V101", date: "2026-04-09", client: "Nexa Studio", contact: "Camille Durand", resultat: "Positif" },
        { id: "V102", date: "2026-04-10", client: "BatiVision", contact: "Hugo Martin", resultat: "Neutre" }
      ],
      relances: [
        { id: "R201", client: "AeroPulse", canal: "Email", priorite: "Haute", echeance: "2026-04-15" },
        { id: "R202", client: "BatiVision", canal: "Téléphone", priorite: "Moyenne", echeance: "2026-04-17" }
      ],
      devis: [
        { id: "D301", client: "Nexa Studio", montant: 7200, statut: "Signé", date: "2026-04-08" },
        { id: "D302", client: "AeroPulse", montant: 15400, statut: "En attente", date: "2026-04-10" }
      ]
    };

    let db = load();
    let active = "dashboard";

    const pages = {
      dashboard: { title: "Dashboard", subtitle: "Vue d'ensemble de l'activité commerciale." },
      clients: { title: "Clients", subtitle: "Contacts, société, segment et potentiel." },
      visites: { title: "Visites", subtitle: "Suivi des rendez-vous et résultats." },
      relances: { title: "Relances", subtitle: "Actions prévues pour conclure." },
      devis: { title: "Devis", subtitle: "Propositions envoyées aux clients." }
    };

    function euro(value) {
      return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(value || 0);
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : structuredClone(sample);
      } catch {
        return structuredClone(sample);
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      alert("Données sauvegardées dans ce navigateur ✅");
    }

    function reset() {
      if (!confirm("Réinitialiser toutes les données locales ?")) return;
      db = structuredClone(sample);
      localStorage.removeItem(STORAGE_KEY);
      renderAll();
      alert("Données remises par défaut.");
    }

    function badgeClass(value) {
      if (["Client actif", "Positif", "Signé", "Haute"].includes(value)) return "ok";
      if (["Prospect", "Neutre", "En attente", "Moyenne"].includes(value)) return "mid";
      if (["À relancer", "Négatif", "Basse"].includes(value)) return "bad";
      return "blue";
    }

    function renderMenu() {
      const menu = document.getElementById("menu");
      menu.innerHTML = Object.keys(pages)
        .map((key) => `<button class="${key === active ? "active" : ""}" data-page="${key}">${pages[key].title}</button>`)
        .join("");

      menu.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          active = btn.dataset.page;
          renderAll();
        });
      });
    }

    function renderDashboard() {
      const el = document.getElementById("dashboardView");
      const actifs = db.clients.filter(c => c.statut === "Client actif").length;
      const potentiel = db.clients.reduce((s, c) => s + Number(c.valeur || 0), 0);

      el.innerHTML = `
        <div class="grid">
          <div class="card"><div class="kpi-label">Clients actifs</div><div class="kpi-value">${actifs}</div></div>
          <div class="card"><div class="kpi-label">Visites</div><div class="kpi-value">${db.visites.length}</div></div>
          <div class="card"><div class="kpi-label">Relances</div><div class="kpi-value">${db.relances.length}</div></div>
          <div class="card"><div class="kpi-label">CA potentiel</div><div class="kpi-value">${euro(potentiel)}</div></div>
        </div>

        <div class="panel">
          <h3>Derniers devis</h3>
          <table>
            <thead><tr><th>ID</th><th>Client</th><th>Montant</th><th>Statut</th></tr></thead>
            <tbody>
              ${db.devis.map(d => `<tr><td>${d.id}</td><td>${d.client}</td><td>${euro(d.montant)}</td><td><span class="badge ${badgeClass(d.statut)}">${d.statut}</span></td></tr>`).join("") || "<tr><td colspan='4'>Aucune donnée</td></tr>"}
            </tbody>
          </table>
        </div>
      `;
    }

    function clientsForm() {
      return `
        <form id="clientForm">
          <input required name="nom" placeholder="Nom du contact" />
          <input required name="societe" placeholder="Société" />
          <select name="segment"><option>PME</option><option>Startup</option><option>Grand compte</option></select>
          <select name="statut"><option>Prospect</option><option>Client actif</option><option>À relancer</option></select>
          <input required type="number" name="valeur" placeholder="Valeur (€)" class="full" />
          <button class="primary full" type="submit">Ajouter client</button>
        </form>`;
    }

    function renderClients() {
      const el = document.getElementById("clientsView");
      el.innerHTML = `
        <div class="panel">
          <h3>Liste clients</h3>
          <table>
            <thead><tr><th>ID</th><th>Nom</th><th>Société</th><th>Segment</th><th>Statut</th><th>Valeur</th></tr></thead>
            <tbody>
              ${db.clients.map(c => `<tr><td>${c.id}</td><td>${c.nom}</td><td>${c.societe}</td><td>${c.segment}</td><td><span class="badge ${badgeClass(c.statut)}">${c.statut}</span></td><td>${euro(c.valeur)}</td></tr>`).join("")}
            </tbody>
          </table>
          ${clientsForm()}
        </div>
      `;

      document.getElementById("clientForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        db.clients.push({
          id: "C" + String(Date.now()).slice(-4),
          nom: f.get("nom"),
          societe: f.get("societe"),
          segment: f.get("segment"),
          statut: f.get("statut"),
          valeur: Number(f.get("valeur") || 0)
        });
        renderAll();
      });
    }

    function simpleTableView(viewId, title, fields, rows) {
      const el = document.getElementById(viewId);
      const headers = fields.map(f => `<th>${f.label}</th>`).join("");
      const body = rows.map(r => `<tr>${fields.map(f => `<td>${f.badge ? `<span class=\"badge ${badgeClass(r[f.key])}\">${r[f.key]}</span>` : (f.money ? euro(r[f.key]) : r[f.key])}</td>`).join("")}</tr>`).join("");
      el.innerHTML = `<div class="panel"><h3>${title}</h3><table><thead><tr>${headers}</tr></thead><tbody>${body || `<tr><td colspan="${fields.length}">Aucune donnée</td></tr>`}</tbody></table></div>`;
    }

    function renderVisites() {
      simpleTableView("visitesView", "Visites", [
        { key: "id", label: "ID" },
        { key: "date", label: "Date" },
        { key: "client", label: "Client" },
        { key: "contact", label: "Contact" },
        { key: "resultat", label: "Résultat", badge: true }
      ], db.visites);
    }

    function renderRelances() {
      simpleTableView("relancesView", "Relances", [
        { key: "id", label: "ID" },
        { key: "client", label: "Client" },
        { key: "canal", label: "Canal" },
        { key: "priorite", label: "Priorité", badge: true },
        { key: "echeance", label: "Échéance" }
      ], db.relances);
    }

    function renderDevis() {
      simpleTableView("devisView", "Devis", [
        { key: "id", label: "ID" },
        { key: "client", label: "Client" },
        { key: "montant", label: "Montant", money: true },
        { key: "statut", label: "Statut", badge: true },
        { key: "date", label: "Date" }
      ], db.devis);
    }

    function renderAll() {
      renderMenu();
      document.getElementById("pageTitle").textContent = pages[active].title;
      document.getElementById("pageSubtitle").textContent = pages[active].subtitle;

      ["dashboard", "clients", "visites", "relances", "devis"].forEach((key) => {
        document.getElementById(key + "View").classList.toggle("hidden", key !== active);
      });

      renderDashboard();
      renderClients();
      renderVisites();
      renderRelances();
      renderDevis();
    }

    document.getElementById("saveBtn").addEventListener("click", save);
    document.getElementById("resetBtn").addEventListener("click", reset);

    renderAll();
  </script>
</body>
</html>
